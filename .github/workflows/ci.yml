name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.6"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: aurora-protocol/aurora-core
          ref: a9e4ab8d744db1739de3bb2ef7058d9f2e4bf4c1
          path: aurora-core
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
      - name: Prepare non-production trust fixture
        run: ./scripts/write-test-native-trust-resource.sh
      - name: Verify Android client
        env:
          AURORA_CORE_DIR: ${{ github.workspace }}/aurora-core
          GOTOOLCHAIN: go1.26.6
          GOCACHE: ${{ github.workspace }}/.cache/go-build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - name: Verify release package contents
        run: |
          ./scripts/verify-release-native-linkage.sh
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -Z1 "$apk" | grep -Fx 'assets/AuroraSignedSeedTrust.bin'
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libauroracore.so'
          unzip -Z1 "$apk" | grep -Fx 'lib/x86_64/libauroracore.so'
