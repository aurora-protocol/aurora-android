name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: aurora-protocol/aurora-core
          ref: 4ebb05622e3900f23647dad8cffc3b62629ab840
          path: aurora-core
          persist-credentials: false
      - name: Verify aurora-core pin matches aurora-core.revision
        run: |
          expected="$(cat aurora-core.revision)"
          actual="$(git -C aurora-core rev-parse HEAD)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::checkout ref does not match aurora-core.revision"
            echo "  aurora-core.revision: $expected"
            echo "  checked out:          $actual"
            echo "Update both the checkout ref above and aurora-core.revision together."
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.26.6"
          cache-dependency-path: aurora-core/go.sum
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.1.12297006" \
            "cmake;3.22.1"
      - name: Prepare non-production trust fixture
        run: ./scripts/write-test-native-trust-resource.sh
      - name: Verify Android client
        env:
          AURORA_CORE_DIR: ${{ github.workspace }}/aurora-core
          # SHA-256 of the checked-in generator's non-production trust fixture.
          AURORA_RELEASE_TRUST_SHA256: 3dc6e04540dda6ce4ef828bc2d27ce9e451d956e06baf2622e07d005bfc9488b
          GOTOOLCHAIN: go1.26.6
          GOCACHE: ${{ github.workspace }}/.cache/go-build
        run: >-
          ./gradlew --no-daemon
          :app:testDebugUnitTest
          :app:testReleaseUnitTest
          :app:lintDebug
          :app:lintRelease
          :app:assembleDebug
          :app:assembleRelease
      - name: Verify release package contents
        env:
          AURORA_CORE_DIR: ${{ github.workspace }}/aurora-core
          AURORA_RELEASE_TRUST_SHA256: 3dc6e04540dda6ce4ef828bc2d27ce9e451d956e06baf2622e07d005bfc9488b
          GOTOOLCHAIN: go1.26.6
          GOCACHE: ${{ github.workspace }}/.cache/go-build
        run: ./scripts/verify-release-native-linkage.sh
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: android-build-reports
          path: app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
